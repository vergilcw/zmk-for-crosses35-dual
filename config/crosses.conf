# Uncomment the following line to enable OLED Displays
CONFIG_ZMK_DISPLAY=y

# The shield enables smooth scrolling, which advertises a HID Resolution
# Multiplier (1..16) but leaves ZMK's scroll output unscaled. Windows sets the
# multiplier to 16 (one unit = 1/16 notch); on Linux the BLE SET_REPORT fails
# and the kernel falls back to 1 (one unit = full notch), so scrolling was 16x
# faster there. Disabling it makes every host read 1 unit = 1 notch; the
# zip_scroll_scaler 1 32 in the keymap compensates (old 1 2 x 1/16).
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=n
